name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  # OIDC for npm Trusted Publishing + provenance; no long-lived NPM_TOKEN.
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./autoace-cli

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org/'

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Use npm 11
        run: npm install -g npm@11.21.0

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish to NPM
        # Requires a Trusted Publisher on npmjs.com for autoace-cli:
        #   repo kuaiyou-app/kuaiyou-open-source, workflow publish-npm.yml.
        # npm then mints a short-lived token from the job's OIDC identity and
        # attaches a provenance attestation, so the tarball is traceable to
        # this commit. Do not publish by hand.
        #
        # Idempotent on purpose: re-running this job (or cutting the GitHub
        # Release after the fact) must not fail with EPUBLISHCONFLICT.
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping."
            exit 0
          fi
          npm publish --access public --provenance
