name: Notify Website Skills Update

# Website: https://github.com/kuaiyou-app/kuaiyou-website
# Set secret WEBSITE_DISPATCH_TOKEN (PAT with repo scope) to auto-rebuild the site
# when skills change. Website also refreshes skills on its own pushes / schedule.

on:
  push:
    branches: ["main"]
    paths:
      - "skills/**"
      - "agent-skills/**"
      - "scripts/build-skill-index.js"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skills index
        run: node scripts/build-skill-index.js

      - name: Dispatch website rebuild
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: kuaiyou-app/kuaiyou-website
          event-type: skills-updated
