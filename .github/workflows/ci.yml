name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  mcp:
    name: MCP Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./autoace-cli
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './autoace-cli/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      # `npm test` builds first, so there is no separate build step.
      - name: Test
        run: npm test

      - name: Pack and smoke-test the published tarball
        run: |
          npm pack
          tarball="$(ls autoace-cli-*.tgz)"
          workdir="$(mktemp -d)"
          npm init -y --prefix "$workdir" >/dev/null 2>&1
          npm install --prefix "$workdir" "$PWD/$tarball" >/dev/null 2>&1
          bin="$workdir/node_modules/autoace-cli/build/index.js"
          # stdout is the JSON-RPC channel: every line must parse. The SDK client
          # below tolerates junk lines, so check the raw stream separately. Run
          # from a dir with a .env so a stray env loader would be caught too.
          probe="$(mktemp -d)"
          echo "FOO=1" > "$probe/.env"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | (cd "$probe" && node "$bin" 2>/dev/null) > "$probe/stdout.txt"
          node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            if (lines.length === 0) throw new Error("no stdout from server");
            for (const line of lines) {
              try { JSON.parse(line); } catch { throw new Error("non-JSON line on MCP stdout: " + line); }
            }
            console.log("stdout is clean JSON-RPC (" + lines.length + " line(s))");
          ' "$probe/stdout.txt"
          # Drive an MCP initialize + tools/list handshake against the installed CLI.
          node --input-type=module -e '
            import { Client } from "@modelcontextprotocol/sdk/client/index.js";
            import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";
            const bin = process.argv[1];
            const transport = new StdioClientTransport({ command: "node", args: [bin], env: { ...process.env, KUAIYOU_DEVICE_IP: "" } });
            const client = new Client({ name: "ci-smoke", version: "1.0.0" }, { capabilities: {} });
            await client.connect(transport);
            const { tools } = await client.listTools();
            if (tools.length < 4) { throw new Error("expected >= 4 tools, got " + tools.length); }
            await client.close();
            console.log("smoke test ok: " + tools.length + " tools");
          ' "$bin"

  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: './autoace-cli/package-lock.json'

      - name: Build the MCP server
        run: npm ci && npm run build
        working-directory: ./autoace-cli

      - name: Run offline skill lint and verify index contract
        run: node scripts/validate-skills.mjs

      - name: Verify Agent Skill tools match autoace-cli
        run: node scripts/validate-agent-skill.mjs
